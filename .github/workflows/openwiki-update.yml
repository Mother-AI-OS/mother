name: OpenWiki Update

# Weekly rather than daily: this runs across ~25 repos and each run is a full
# agentic pass. Manual dispatch is available when docs are needed sooner.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.3.1 mermaid@11.16.0 jsdom@29.1.1

      - name: Fail fast if the provider key is missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY is not set. Add it as an organization secret."
            exit 1
          fi

      - name: Run OpenWiki
        id: run
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -o pipefail
          openwiki code --update --print 2>&1 | tee openwiki-run.log

      # openwiki exits 0 even when the provider rejects the credentials, so exit
      # status alone cannot be trusted. Inspect the log for known failure modes.
      - name: Verify the run actually succeeded
        run: |
          if grep -qiE 'Incorrect API key|MODEL_AUTHENTICATION|is required for non-interactive|Rate limit|insufficient_quota' openwiki-run.log; then
            echo "::error::OpenWiki reported a provider error despite exiting 0."
            tail -20 openwiki-run.log
            exit 1
          fi
          echo "No provider errors detected."

      - name: Remove the run log before committing
        if: always()
        run: rm -f openwiki-run.log

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Deliberately limited to openwiki/ — CLAUDE.md and AGENTS.md are
          # human-maintained project memory on this estate and must not be
          # rewritten by an agent.
          add-paths: |
            openwiki
          branch: openwiki/update
          delete-branch: true
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            Generated by the scheduled OpenWiki workflow. Review the diff before
            merging — the wiki is agent-written and can be wrong.
